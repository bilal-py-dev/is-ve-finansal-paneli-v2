<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Girişi | İş & Finansal Panel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #1e293b; padding: 35px; border-radius: 14px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        p { color: #94a3b8; text-align: center; font-size: 14px; margin-bottom: 25px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #e2e8f0; }
        input { width: 100%; padding: 12px; margin-bottom: 18px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .hata { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Yönetici Girişi</h2>
        <p>İş ve Finansal Yönetim Paneli</p>
        {% if hata %}
        <div class="hata">{{ hata }}</div>
        {% endif %}
        <form action="/login" method="post">
            <label>Kullanıcı Adı</label>
            <input type="text" name="kullanici_adi" placeholder="admin" required>
            <label>Şifre</label>
            <input type="password" name="sifre" placeholder="••••••" required>
            <button type="submit">Giriş Yap</button>
        </form>
    </div>
</body>
</html>
